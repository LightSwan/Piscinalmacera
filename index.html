<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f9;--card:#fff;--tx:#12202e;--mut:#5d6f80;--bd:#d5dde5;--free:#2e9e5b;--busy:#d6403a;--mid:#f0902a;--none:#8796a5;--water:#4fb4e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141b;--card:#16202a;--tx:#e8eef4;--mut:#93a4b4;--bd:#2a3846}}
:root[data-theme="dark"]{--bg:#0d141b;--card:#16202a;--tx:#e8eef4;--mut:#93a4b4;--bd:#2a3846}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:1200px;margin-inline:auto}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}

.now{color:var(--mut);font-size:.95rem}
.pool{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:clamp(300px,58vh,620px);border:6px solid #cfd8de;border-radius:14px;background:var(--water);overflow:hidden}
.lane{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 2px;text-align:center;border-right:4px dashed rgba(255,255,255,.85);min-width:0}
.lane:last-child{border-right:0}
.lane::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.78;transition:background .3s}
.lane .n{position:relative;z-index:1;font-weight:800;font-size:clamp(1.4rem,4vw,2.6rem);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.lane .s{position:relative;z-index:1;color:#fff;font-weight:700;font-size:clamp(.7rem,1.9vw,1.4rem);text-shadow:0 1px 3px rgba(0,0,0,.45);overflow-wrap:anywhere;max-width:100%}
.free{--c:var(--free)}.busy{--c:var(--busy)}.mid{--c:var(--mid)}.none{--c:var(--none)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
input[type=color]{padding:2px;width:44px;height:36px}
button{cursor:pointer}button.p{background:#1f6fb5;color:#fff;border-color:#1f6fb5}button.d{color:#d6403a}
.slot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--bd)}
.slot:first-of-type{border-top:0}
.dots{display:flex;gap:3px;align-items:center}.dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.leg span{margin-right:12px;font-size:.85rem;color:var(--mut)}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;background:var(--c)}
.days label{display:inline-flex;gap:3px;align-items:center;margin-right:8px}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:5px 0}.ln b{width:70px}.ln input:not([type=color]){flex:1 1 140px;min-width:120px}

.cfg{display:flex;flex-wrap:wrap;gap:12px}.cfg .row{flex:1 1 220px}
#msg{color:var(--mut);font-size:.85rem;margin-top:8px}
[hidden]{display:none!important}
#foot{display:flex;align-items:flex-end;justify-content:flex-start;gap:12px;margin-top:8px}
#qr{display:none;flex-direction:column;align-items:center;text-decoration:none;color:#12202e;font-weight:700;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:6px;flex:none}
#qrimg svg{width:clamp(84px,11vh,130px);height:auto;display:block}
#qrt{font-size:.8rem;margin-top:4px;text-align:center}
body.tv #qrt{font-size:1rem}
body.tv #qr{display:flex;border:6px solid #4aa3ff;border-radius:16px;padding:8px 10px;animation:qrborder 20s ease-in-out infinite}

@keyframes qrborder{0%,100%{border-color:#4aa3ff}50%{border-color:#0b2a8a}}
#logo{display:none}
body.tv #logo{display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:2.4vh;height:clamp(60px,12vh,125px);width:auto;max-width:30vw;z-index:4}
#cq{display:none}
#cqh{text-align:center;font-weight:700;font-size:1.1rem}
#cqf{display:none;justify-content:center;margin-top:12px}
body.cq #cqf{display:flex}
#cqd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
#cqd button{padding:10px 0;font-weight:700;font-size:.85rem}
#cqd button.on{background:#1f6fb5;color:#fff;border-color:#1f6fb5}
#cqs{text-align:center;color:var(--mut);margin-bottom:4px;min-height:1.3em}
#cqw{position:relative;display:flex;justify-content:center;align-items:center;gap:2px;margin:4px 0}
#cqw::before{content:"";position:absolute;left:14%;right:14%;top:50%;height:44px;transform:translateY(-50%);background:var(--bd);opacity:.55;border-radius:10px;pointer-events:none}
#cqw b{font-size:2rem;position:relative}
.wh{position:relative;height:132px;width:96px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wh::-webkit-scrollbar{display:none}
.wh .pad{height:44px}
.wi{height:44px;line-height:44px;text-align:center;font-size:2rem;font-weight:600;color:var(--mut);scroll-snap-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.wi.sel{color:var(--tx);font-weight:800}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20}

body.cq header,body.cq #clk,body.cq #vrow,body.cq #lg,body.cq #listc,body.cq #ed,body.cq #cfgc,body.cq #bkc,body.cq #qr,body.cq #sw{display:none!important}

#clk{text-align:center;margin:4px 0 12px}
#ct{font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;font-size:clamp(2.2rem,6vw,4rem)}
#sy{font-size:.75rem;color:var(--mut);opacity:.7}

#cs{color:var(--mut);font-size:1.05rem;margin-top:2px}
body.tv #ct{font-size:clamp(3rem,9vw,7rem)}
body.tv #cs{font-size:1.6rem}

.ic{position:relative;width:min(92vw,420px);max-height:86dvh;overflow:auto;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(232,238,255,.92));border:1px solid #fff;border-radius:28px;padding:26px 20px 20px;box-shadow:0 24px 60px rgba(30,27,75,.35);color:#2b3a32;font-family:Sora,system-ui,sans-serif;animation:ipop .28s cubic-bezier(.2,.9,.3,1.2)}

  $("cqs").textContent=DAYS[c.d]+(a?" · "+(a.name||a.start+"–"+a.end):"");$("cs").textContent=(view?"Consultando: ":"")+DAYS[c.d]+(a?" · "+(a.name||a.start+"–"+a.end):"");tick();
  $("pool").innerHTML=[0,1,2,3,4,5].map(i=>{const L=a?a.lanes[i]:{s:"mid"};
    return `<div class="lane ${L.s}"${L.c?` style="--c:${L.c}"`:""}><div class="n">${i+1}</div><div class="s">${esc(L.n||stName(L.s))}</div></div>`}).join("");
  const sorted=[...slots].sort((x,y)=>x.start.localeCompare(y.start));
  $("list").innerHTML=sorted.length?sorted.map(s=>`<div class="slot"><div><b>${esc(s.name||"Franja")}</b> ${s.start}–${s.end}<br><small class="now">${s.days.length==7?"Todos los días":s.days.map(d=>DAYS[d].slice(0,3)).join(", ")}</small></div>
  <div class="dots">${s.lanes.map(l=>`<span class="dot ${l.s}"${l.c?` style="--c:${l.c}"`:""}${l.n?` title="${esc(l.n)}"`:""}></span>`).join("")}</div>
  ${canWrite?`<div class="row"><button data-e="${s.id}">Editar</button><button class="d" data-x="${s.id}">Borrar</button></div>`:""}</div>`).join(""):`<p class="now">Aún no hay franjas.</p>`;
}
function renderLanes(){
  $("lns").innerHTML=edit.lanes.map((L,i)=>`<div class="ln"><b>Calle ${i+1}</b><span class="seg">${KEYS.map(k=>`<button class="${k} ${L.s==k?"on":""}" data-l="${i}" data-v="${k}">${esc(stName(k))}</button>`).join("")}</span><input data-ln="${i}" placeholder="Texto (opcional)" maxlength="30" value="${esc(L.n||"")}"><input type="color" data-lc="${i}" value="${L.c||cfg[L.s].color}"><button data-lr="${i}" title="Quitar texto y color propios">↺</button></div>`).join("");
}
function refreshUi(){
  applyCfg();if(!$("cfg").contains(document.activeElement))buildCfg();render();if(edit)renderLanes();
}
function setAdmin(){
  canWrite=!!sess;
  $("adm").textContent=canWrite?"Salir":"Entrar como admin";
  $("add").hidden=!canWrite;$("cfgc").hidden=!canWrite;$("bkc").hidden=!canWrite;
  if(!canWrite){$("ed").hidden=true;edit=null}
  refreshUi();
}
$("adm").onclick=()=>{
  if(sess){saveSess(null);setAdmin();setMsg("Sesión cerrada.");return}
  $("lg").hidden=!$("lg").hidden;if(!$("lg").hidden)$("em").focus();
};
$("lc").onclick=()=>{$("lg").hidden=true};
async function doLogin(){
  const m=t=>{$("lgm").textContent=t;setMsg(t)};
  if(!$("em").value.trim()||!$("pw").value){m("Escribe el email y la contraseña.");return}
  m("Entrando…");
  try{await login($("em").value.trim(),$("pw").value);$("pw").value="";$("lg").hidden=true;$("lgm").textContent="";setAdmin();setMsg("Sesión de admin iniciada.")}
  catch(e){m(e instanceof TypeError?"No se pudo conectar con Supabase. Revisa la conexión.":"No se pudo entrar: "+e.message)}
}
$("go").onclick=doLogin;$("pw").onkeydown=e=>{if(e.key==="Enter")doLogin()};
$("cfg").addEventListener("input",e=>{
  const t=e.target,k=t.dataset.c||t.dataset.n;if(!k||!canWrite)return;
  if(t.dataset.c)cfg[k].color=t.value;else cfg[k].name=t.value;
  applyCfg();render();if(edit)renderLanes();persistCfg();
});
$("cfg").addEventListener("click",e=>{
  if(e.target.id==="rst"&&canWrite){cfg=JSON.parse(JSON.stringify(DEF));applyCfg();buildCfg();render();if(edit)renderLanes();persistCfg()}
});
function openEd(s){
  edit=s?JSON.parse(JSON.stringify(s)):{id:"s"+Date.now(),name:"",start:"09:00",end:"10:00",days:[0,1,2,3,4],lanes:Array.from({length:6},()=>({s:"free"}))};
  $("edt").textContent=s?"Editar franja":"Nueva franja";
  $("nm").value=edit.name;$("t1").value=edit.start;$("t2").value=edit.end;
  $("days").innerHTML=DAYS.map((d,i)=>`<label><input type="checkbox" data-d="${i}" ${edit.days.includes(i)?"checked":""}>${d.slice(0,3)}</label>`).join("");
  renderLanes();
  $("ed").hidden=false;$("ed").scrollIntoView({behavior:"smooth"});
}
$("add").onclick=()=>canWrite&&openEd(null);
$("cx").onclick=()=>{$("ed").hidden=true;edit=null};
$("lns").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lr!==undefined){const L=edit.lanes[+b.dataset.lr];delete L.n;delete L.c;renderLanes();return}
  const i=+b.dataset.l;edit.lanes[i].s=b.dataset.v;
  b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  if(!edit.lanes[i].c)$("lns").querySelector(`[data-lc="${i}"]`).value=cfg[b.dataset.v].color;
};
$("lns").oninput=e=>{const t=e.target;
  if(t.dataset.ln!==undefined)edit.lanes[+t.dataset.ln].n=t.value;
  else if(t.dataset.lc!==undefined)edit.lanes[+t.dataset.lc].c=t.value};
$("sv").onclick=async()=>{
  edit.lanes=edit.lanes.map(normLane);edit.name=$("nm").value.trim();edit.start=$("t1").value;edit.end=$("t2").value;
  edit.days=[...document.querySelectorAll("#days input:checked")].map(x=>+x.dataset.d);
  if(!edit.start||!edit.end||edit.end<=edit.start){setMsg("La hora de fin debe ser posterior a la de inicio.");return}
  if(!edit.days.length){setMsg("Elige al menos un día.");return}
  const i=slots.findIndex(s=>s.id===edit.id);if(i>=0)slots[i]=edit;else slots.push(edit);
  $("ed").hidden=true;edit=null;render();await persist();
};
$("list").onclick=async e=>{
  const b=e.target.closest("button");if(!b||!canWrite)return;
  if(b.dataset.e)openEd(slots.find(s=>s.id===b.dataset.e));
  if(b.dataset.x&&confirm("¿Borrar esta franja?")){slots=slots.filter(s=>s.id!==b.dataset.x);render();await persist()}
};
$("dl").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({slots,cfg},null,2)],{type:"application/json"}));
  a.download="datos-piscina.json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);setMsg("Archivo descargado.");
};
$("ul").onclick=()=>$("fi").click();
$("fi").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!canWrite)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||typeof d!=="object"||!Array.isArray(d.slots))throw new Error("formato no válido");
    if(!confirm("Se sustituirán todas las franjas y colores actuales por los del archivo. ¿Continuar?"))return;
    applyData(d);refreshUi();await persist();setMsg("Datos importados y guardados ✓");
  }catch(err){setMsg("No se pudo importar: "+err.message)}
};
$("vd").innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("");
function syncView(){const c=cur();$("vd").value=c.d;$("vt").value=c.t}
const onV=()=>{view={d:+$("vd").value,t:$("vt").value||"00:00"};render()};
$("vd").onchange=onV;$("vt").onchange=onV;
$("vn").onclick=()=>{view=null;syncView();render()};
function setMode(tv){
  document.body.classList.toggle("tv",tv);
  $("sw").textContent=tv?"⚙":"📺 Modo TV";
  if(tv){view=null;edit=null;$("ed").hidden=true;$("lg").hidden=true;syncView()}
  render();
}
$("sw").onclick=async()=>{const tv=!document.body.classList.contains("tv");setMode(tv);if(tv&&!SUPA_KEY.startsWith("PEGA")&&await load())refreshUi()};
function qrLink(){if(QR_URL)return QR_URL;const u=new URL(location.href);u.search="";u.hash="#consulta";return u.toString()}
function buildQr(){try{const q=qrcode(0,"M");q.addData(qrLink());q.make();$("qrimg").innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});$("qr").href=qrLink()}catch(e){$("qr").hidden=true}}
const ITEM=44;
function buildWheel(el,n){el.innerHTML='<div class="pad"></div>'+Array.from({length:n},(_,i)=>`<div class="wi" data-i="${i}">${String(i).padStart(2,"0")}</div>`).join("")+'<div class="pad"></div>'}
buildWheel($("cqwh"),24);buildWheel($("cqwm"),60);
let wl=false;
function mark(el,i){[...el.querySelectorAll(".wi")].forEach((x,k)=>x.classList.toggle("sel",k===i))}
function setWheel(h,m){wl=true;$("cqwh").scrollTop=h*ITEM;$("cqwm").scrollTop=m*ITEM;mark($("cqwh"),h);mark($("cqwm"),m);setTimeout(()=>{wl=false},80)}
function syncCq(){
  const c=cur(),hm=c.t.split(":").map(Number);
  [...$("cqd").children].forEach(b=>b.classList.toggle("on",+b.dataset.d===c.d));
  setWheel(hm[0],hm[1]);
}
$("cqd").innerHTML=DAYS.map((d,i)=>`<button data-d="${i}">${d.slice(0,3)}</button>`).join("");
$("cqd").onclick=e=>{const b=e.target.closest("button");if(!b)return;view={d:+b.dataset.d,t:cur().t};syncCq();render()};
function wIdx(el,max){return Math.max(0,Math.min(max,Math.round(el.scrollTop/ITEM)))}
function onWheel(){
  if(wl)return;
  const h=wIdx($("cqwh"),23),m=wIdx($("cqwm"),59),p=n=>String(n).padStart(2,"0"),t=p(h)+":"+p(m);
  mark($("cqwh"),h);mark($("cqwm"),m);
  if(t!==cur().t){view={d:cur().d,t};render()}
}
$("cqwh").onscroll=onWheel;$("cqwm").onscroll=onWheel;
function openPop(){$("popt").value=cur().t;$("pop").hidden=false;$("popt").focus()}
$("cqw").onclick=e=>{const it=e.target.closest(".wi");if(!it)return;
  if(it.classList.contains("sel"))openPop();else it.parentElement.scrollTo({top:+it.dataset.i*ITEM,behavior:"smooth"})};
$("popc").onclick=()=>{$("pop").hidden=true};
$("pop").onclick=e=>{if(e.target===$("pop"))$("pop").hidden=true};
$("popo").onclick=()=>{const v=$("popt").value;if(!/^\d{2}:\d{2}/.test(v))return;$("pop").hidden=true;view={d:cur().d,t:v.slice(0,5)};syncCq();render()};
$("popt").onkeydown=e=>{if(e.key==="Enter")$("popo").click();if(e.key==="Escape")$("popc").click()};
$("cqn").onclick=()=>{view=null;const c=cur();view={d:c.d,t:c.t};syncCq();render()};
$("cqb").onclick=()=>{try{history.replaceState(null,"",location.pathname)}catch(e){}document.body.classList.remove("cq");view=null;setMode(true);syncView();render()};
syncView();setAdmin();setMode(true);buildQr();
const IC={user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',blog:'<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>'};
function irow(ic,label,val,href){
  const inner=`<span class="iic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[ic]}</svg></span><span class="itx"><span class="il">${esc(label)}</span><span class="iv">${esc(val)}</span></span>`+(href?'<span class="iar">›</span>':"");
  return href?`<a class="irow" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`:`<div class="irow">${inner}</div>`;
}
function contactHref(u){u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:u.includes("@")?"mailto:"+u:/^[+\d\s()-]{6,}$/.test(u)?"tel:"+u.replace(/\s/g,""):""}
function buildInfo(){
  const a=INFO.autor||{},d=INFO.dudas||{};let h="";
  if(a.nombre)h+=irow("user","Creado por",a.nombre,/^https?:\/\//i.test(a.enlace||"")?a.enlace:"");
  if(d.nombre||d.contacto)h+=irow("mail","Dudas y consultas",[d.nombre,d.contacto].filter(Boolean).join(" · "),contactHref(d.contacto));
  if(INFO.biblioteca)h+=irow("book","Más herramientas","Biblioteca de la Natación",INFO.biblioteca);
  if(INFO.blog)h+=irow("blog","Noticias y actividades","Blog de la piscina",INFO.blog);
  $("infb").innerHTML=h||'<p class="now" style="text-align:center">Información pendiente de completar.</p>';
}
const closeInfo=()=>{$("info").hidden=true};
$("infob").onclick=()=>{buildInfo();$("info").hidden=false};
$("infx").onclick=closeInfo;$("infc").onclick=closeInfo;
$("info").onclick=e=>{if(e.target===$("info"))closeInfo()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("info").hidden)closeInfo()});
function enterCq(){setMode(false);document.body.classList.add("cq");const c0=cur();view={d:c0.d,t:c0.t};syncCq();render()}
$("qr").onclick=e=>{e.preventDefault();enterCq()};
if(LOGO_SRC){$("logo").src=LOGO_SRC;$("logo").hidden=false}
if(CQ)enterCq();
function tick(){
  const n=nowP(),t=n.h+":"+n.m;
  $("ct").textContent=view?view.t:t+":"+n.s;
  if(!view&&t!==lastMin){lastMin=t;syncView();render()}
}
async function syncTime(){
  const tries=[
    async()=>{const t0=Date.now();const r=await api("/rest/v1/rpc/server_time",{method:"POST",body:"{}"});if(!r.ok)throw 0;return{ms:Date.parse(await r.json()),t0,t1:Date.now(),src:"servidor"}},
    async()=>{const t0=Date.now();const r=await api("/rest/v1/pool_data?id=eq.1&select=id",{cache:"no-store"});const h=r.headers.get("date");if(!h)throw 0;return{ms:Date.parse(h)+500,t0,t1:Date.now(),src:"servidor"}},
    async()=>{const t0=Date.now();const r=await fetch("https://timeapi.io/api/Time/current/zone?timeZone=UTC",{cache:"no-store"});const j=await r.json();return{ms:Date.parse(j.dateTime.replace(/(\.\d{3})\d*/,"$1")+"Z"),t0,t1:Date.now(),src:"timeapi.io"}}
  ];
  for(const f of tries){
    try{const x=await f();if(isNaN(x.ms))throw 0;
      off=x.ms+(x.t1-x.t0)/2-x.t1;
      $("sy").textContent="Hora sincronizada ("+x.src+")";return}
    catch(e){}
  }
  $("sy").textContent="Sin sincronizar: usando la hora del dispositivo";
}
function loop(){tick();setTimeout(loop,1000-((Date.now()+off)%1000)+10)}
loop();syncTime();setInterval(syncTime,600000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncTime()});
setInterval(async()=>{if(edit||dirty||SUPA_KEY.startsWith("PEGA"))return;if(await load())refreshUi()},20000);
(async()=>{
  if(SUPA_KEY.startsWith("PEGA")){setMsg("Falta pegar la clave anon de Supabase en la constante SUPA_KEY del HTML.");return}
  if(sess&&!await token())saveSess(null);
  setAdmin();
  if(await load())refreshUi();
})();
</script>
