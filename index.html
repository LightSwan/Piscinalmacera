<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calles de la piscina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f9;--card:#fff;--tx:#12202e;--mut:#5d6f80;--bd:#d5dde5;--free:#2e9e5b;--busy:#d6403a;--mid:#f0902a;--none:#8796a5;--water:#4fb4e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141b;--card:#16202a;--tx:#e8eef4;--mut:#93a4b4;--bd:#2a3846}}
:root[data-theme="dark"]{--bg:#0d141b;--card:#16202a;--tx:#e8eef4;--mut:#93a4b4;--bd:#2a3846}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:1200px;margin-inline:auto}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:1.25rem;margin:0}
.now{color:var(--mut);font-size:.95rem}
.pool{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:clamp(300px,58vh,620px);border:6px solid #cfd8de;border-radius:14px;background:var(--water);overflow:hidden}
.lane{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 2px;text-align:center;border-right:4px dashed rgba(255,255,255,.85);min-width:0}
.lane:last-child{border-right:0}
.lane::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.78;transition:background .3s}
.lane .n{position:relative;z-index:1;font-weight:800;font-size:clamp(1.4rem,4vw,2.6rem);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.lane .s{position:relative;z-index:1;color:#fff;font-weight:700;font-size:clamp(.7rem,1.9vw,1.4rem);text-shadow:0 1px 3px rgba(0,0,0,.45);overflow-wrap:anywhere;max-width:100%}
.free{--c:var(--free)}.busy{--c:var(--busy)}.mid{--c:var(--mid)}.none{--c:var(--none)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
input[type=color]{padding:2px;width:44px;height:36px}
button{cursor:pointer}button.p{background:#1f6fb5;color:#fff;border-color:#1f6fb5}button.d{color:#d6403a}
.slot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--bd)}
.slot:first-of-type{border-top:0}
.dots{display:flex;gap:3px;align-items:center}.dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.leg span{margin-right:12px;font-size:.85rem;color:var(--mut)}.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;background:var(--c)}
.days label{display:inline-flex;gap:3px;align-items:center;margin-right:8px}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:5px 0}.ln b{width:70px}.ln input:not([type=color]){flex:1 1 140px;min-width:120px}
.seg button{border-radius:0;margin:0 -1px 0 0}.seg button.on{color:#fff;background:var(--c);border-color:var(--c)}
.cfg{display:flex;flex-wrap:wrap;gap:12px}.cfg .row{flex:1 1 220px}
#msg{color:var(--mut);font-size:.85rem;margin-top:8px}
[hidden]{display:none!important}
#foot{display:flex;align-items:flex-end;justify-content:flex-start;gap:12px;margin-top:8px}
#qr{display:none;flex-direction:column;align-items:center;text-decoration:none;color:#12202e;font-weight:700;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:6px;flex:none}
#qrimg svg{width:clamp(84px,11vh,130px);height:auto;display:block}
#qrt{font-size:.8rem;margin-top:4px;text-align:center}
body.tv #qrt{font-size:1rem}
body.tv #qr{display:flex;border:6px solid #4aa3ff;border-radius:16px;padding:8px 10px;animation:qrborder 20s ease-in-out infinite}
body.tv #foot{position:fixed;left:2.8vw;bottom:2.4vh;z-index:5;margin:0}
body.tv #qrimg svg{width:clamp(100px,13vh,150px)}
@keyframes qrborder{0%,100%{border-color:#4aa3ff}50%{border-color:#0b2a8a}}
#cq{display:none}
#cqh{text-align:center;font-weight:700;font-size:1.1rem}
#cqf{display:none;justify-content:center;margin-top:12px}
body.cq #cqf{display:flex}
#cqd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
#cqd button{padding:10px 0;font-weight:700;font-size:.85rem}
#cqd button.on{background:#1f6fb5;color:#fff;border-color:#1f6fb5}
#cqs{text-align:center;color:var(--mut);margin-bottom:4px;min-height:1.3em}
#cqw{position:relative;display:flex;justify-content:center;align-items:center;gap:2px;margin:4px 0}
#cqw::before{content:"";position:absolute;left:14%;right:14%;top:50%;height:44px;transform:translateY(-50%);background:var(--bd);opacity:.55;border-radius:10px;pointer-events:none}
#cqw b{font-size:2rem;position:relative}
.wh{position:relative;height:132px;width:96px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wh::-webkit-scrollbar{display:none}
.wh .pad{height:44px}
.wi{height:44px;line-height:44px;text-align:center;font-size:2rem;font-weight:600;color:var(--mut);scroll-snap-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.wi.sel{color:var(--tx);font-weight:800}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .25s}
#pop.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease,visibility 0s}
#pop .pc{transform:translateY(20px) scale(.96);transition:transform .38s cubic-bezier(.22,1,.36,1)}
#pop.on .pc{transform:none}
#pop .pc{background:var(--card);color:var(--tx);border-radius:14px;padding:18px;width:min(90vw,320px);display:flex;flex-direction:column;gap:12px}
#popt{font-size:2rem;text-align:center}
body.cq #cq{display:block}
body.cq header,body.cq #clk,body.cq #vrow,body.cq #lg,body.cq #listc,body.cq #ed,body.cq #cfgc,body.cq #bkc,body.cq #qr,body.cq #sw{display:none!important}
body.cq{padding:12px}
body.cq .pool{height:40dvh;min-height:220px;margin-top:8px}
body.cq .lane .n{font-size:1.6rem}body.cq .lane .s{font-size:.7rem}
#sw{position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:9}
body.tv{padding:18px;user-select:none;-webkit-user-select:none}
body.tv #vrow,body.tv #lg,body.tv #listc,body.tv #ed,body.tv #cfgc,body.tv #bkc,body.tv #adm{display:none!important}
body.tv .pool{height:calc(100dvh - 360px);min-height:220px}
body.tv{--bg:#fff;--card:#fff;--tx:#12202e;--mut:#4a5b6b;--bd:#d5dde5;background:#fff;color:#12202e}
body.tv header{display:none}
#clk{text-align:center;margin:4px 0 12px}
#ct{font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;font-size:clamp(2.2rem,6vw,4rem)}
#sy{font-size:.75rem;color:var(--mut);opacity:.7}
body.tv #sy{display:none}
#cs{color:var(--mut);font-size:1.05rem;margin-top:2px}
body.tv #ct{font-size:clamp(3rem,9vw,7rem)}
body.tv #cs{font-size:1.6rem}
body.tv .lane .n{font-size:clamp(2rem,7vw,6rem)}
body.tv .lane .s{font-size:clamp(1rem,2.8vw,2.8rem)}
body.tv .leg span{font-size:1.2rem}
body.tv #sw{opacity:.07;padding:4px 8px;font-size:.8rem}
body.tv #sw:hover{opacity:.6}

/* ---- Vista de consulta: estilo Biblioteca de la Natación ---- */
.bgw{display:none}
body.cq .bgw{display:block;position:fixed;inset:-60px;z-index:-1;pointer-events:none;background-image:linear-gradient(45deg,#a1c4fd 0%,#c2e9fb 50%,#d4a5ff 100%);background-size:600% 600%;animation:bgshift 35s linear infinite;filter:blur(50px);transform:translateZ(0)}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
html:has(body.cq){background:#c2e9fb}
body.cq{--card:rgba(255,255,255,.6);--tx:#2b3a32;--mut:#5b6b8a;--bd:rgba(255,255,255,.7);background:transparent;color:#2b3a32;font-family:Sora,system-ui,sans-serif;max-width:560px;padding:30px 16px 44px}
body.cq button{font-family:inherit}
#cqhead{text-align:center;margin-bottom:22px}
#cqhead h1{font-family:Comfortaa,Sora,sans-serif;font-size:2.1rem;font-weight:700;color:#312e81;letter-spacing:.01em;margin:0 0 6px}
#cqhead p{font-size:.95rem;font-weight:600;color:#4338ca;margin:0}
.gl{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.75);border-radius:24px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 12px 36px rgba(29,78,216,.16),inset 0 1px 0 rgba(255,255,255,.6);padding:14px}
body.cq #cqd{margin:0 0 12px;gap:6px}
body.cq #cqd button{border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.7);border-radius:999px;color:#312e81;font-weight:700;font-size:.8rem;padding:9px 0}
body.cq #cqd button.on{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(99,102,241,.4)}
body.cq #cqs{color:#4338ca;font-weight:600;margin-bottom:2px}
body.cq #cqw::before{background:rgba(99,102,241,.14)}
body.cq #cqw b{color:#312e81}
body.cq .wi{color:#8a94c4;font-weight:700}
body.cq .wi.sel{color:#312e81;font-weight:800}
body.cq #cqbox .now{color:#5b6b8a}
body.cq #cqn{border-radius:999px;background:#fff;border:none;padding:10px 24px;font-weight:700;color:#2b3a32;box-shadow:0 4px 14px rgba(0,0,0,.08)}
body.cq .pool{height:38dvh;border:1px solid rgba(255,255,255,.8);border-radius:24px;box-shadow:0 12px 36px rgba(29,78,216,.2);margin-top:14px}
body.cq .lane{border-right:3px dashed rgba(255,255,255,.8)}
body.cq .lane:last-child{border-right:0}
body.cq #cqf{margin-top:18px}
body.cq #cqb{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:none;border-radius:999px;background:#fff;color:#312e81;font-weight:700;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer}
#cqfoot{display:none}
body.cq #cqfoot{display:block;text-align:center;margin-top:34px;padding-top:22px;border-top:1px solid rgba(43,58,50,.12);color:#5b6b8a;font-size:.85rem}
#infob{display:inline-flex;align-items:center;gap:8px;padding:12px 30px;border:none;border-radius:999px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;font-family:inherit;font-weight:700;font-size:.95rem;box-shadow:0 8px 22px rgba(99,102,241,.45);cursor:pointer}
#info{position:fixed;inset:0;z-index:30;background:rgba(30,27,75,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .32s ease,visibility 0s linear .32s}
#info.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .32s ease,visibility 0s}
.ic{position:relative;width:min(92vw,420px);max-height:86dvh;overflow:auto;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(232,238,255,.92));border:1px solid #fff;border-radius:28px;padding:26px 20px 20px;box-shadow:0 24px 60px rgba(30,27,75,.35);color:#2b3a32;font-family:Sora,system-ui,sans-serif;overscroll-behavior:contain;opacity:0;transform:translateY(32px) scale(.94);transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s ease}
#info.on .ic{opacity:1;transform:none}
#infx{position:absolute;top:12px;right:14px;width:34px;height:34px;border:none;border-radius:50%;background:rgba(99,102,241,.12);color:#312e81;font-size:1.3rem;line-height:1;cursor:pointer;padding:0}
.ihead{text-align:center;margin-bottom:8px}
.ibadge{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.4)}
.ibadge svg{width:26px;height:26px}
.ihead h2{font-family:Comfortaa,Sora,sans-serif;font-size:1.5rem;color:#312e81;margin:10px 0 2px}
.ihead p{margin:0;font-size:.85rem;font-weight:600;color:#4338ca}
.irow{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid rgba(99,102,241,.14);color:inherit;text-decoration:none}
a.irow:active{background:rgba(99,102,241,.1)}
.iic{flex:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff}
.iic svg{width:20px;height:20px}
.itx{flex:1;display:flex;flex-direction:column;min-width:0}
.il{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6b7bb5}
.iv{font-weight:700;color:#312e81;overflow-wrap:anywhere}
.ilk{color:#4338ca;font-weight:600;font-size:.92rem;text-decoration:none;overflow-wrap:anywhere;margin-top:2px}
.iar{color:#6366f1;font-size:1.4rem;font-weight:700}
#infc{display:block;margin:16px auto 0;padding:11px 30px;border:none;border-radius:999px;background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 8px 22px rgba(99,102,241,.4)}

/* ---- Consulta: pantalla fija, sin scroll; la piscina ocupa el espacio libre ---- */
html:has(body.cq){height:100dvh;overflow:hidden;overscroll-behavior:none}
body.cq{height:100%;overflow:hidden;overscroll-behavior:none;display:flex;flex-direction:column;padding:10px 14px}
body.cq>*{flex:none}
body.cq #cqhead{margin-bottom:10px}
body.cq #cqhead h1{font-size:clamp(1.5rem,4.2dvh,2.1rem);margin-bottom:4px}
body.cq .gl{padding:10px}
body.cq #cqd{margin-bottom:8px}
body.cq #cqbox .now{line-height:1.2}
body.cq .pool{flex:1 1 0;min-height:80px;height:auto;margin-top:10px}
body.cq #cqf{margin-top:10px}
body.cq #cqfoot{margin-top:10px;padding-top:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
@media (max-height:700px){body.cq #cqhead p,body.cq #cqbox .now:not(#cqs){display:none}}
/* ---- Sin selección de texto ni menús al mantener pulsado ---- */
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-user-select:text;user-select:text}
img,svg,a{-webkit-user-drag:none;user-drag:none}
/* ---- Líneas de calle en T (como las del fondo de la piscina) y tarima en calles 5 y 6 ---- */
.lt,.lb{flex:1 1 0;min-height:0;width:100%;position:relative}
.lt::after,.lb::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#0b2f66;opacity:.9;border-radius:2px;z-index:1}
.lt::before,.lb::before{content:"";position:absolute;left:50%;width:clamp(12px,42%,28px);height:3px;transform:translateX(-50%);background:#0b2f66;opacity:.9;border-radius:2px;z-index:1}
.lt::before{top:0}.lb::before{bottom:0}
.lane.tar .lt::before,.lane.tar .lt::after{display:none}
.lane.tar{background:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 2px,transparent 2px 14px) 0 0/100% 50% no-repeat,linear-gradient(#9aa5ae,#9aa5ae) 0 0/100% 50% no-repeat}

/* ---- Logos: Biblioteca (centro) y escudo de Almàssera (derecha) ---- */
#logos{display:none}
body.tv #logos,body.cq #logos{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%}
body.tv #logos{position:fixed;left:0;right:0;bottom:2.4vh;padding:0 2.8vw;z-index:4;width:auto}
#logos a{display:block;line-height:0;text-decoration:none;-webkit-tap-highlight-color:transparent}
#logos img{display:block;width:auto;height:clamp(60px,12vh,125px)}
#lgb{grid-column:2}
#lge{grid-column:3;justify-self:end}
body.cq #logos{align-items:end}
body.cq #logos img{height:44px}
body.cq #logos #lge img{height:62px}
body.cq #logos #lgbi{transform:translateY(-6px)}
body.cq #lgb{grid-column:1;justify-self:start}
body.cq #logos a{padding:2px 6px}
body.cq #logos a:active{opacity:.6}
@media (max-height:700px){body.cq #logos img{height:36px}body.cq #logos #lge img{height:50px}}
/* ---- Modo TV: QR, logo y escudo con la misma altura (--bh) ---- */
body.tv{--bh:clamp(110px,17vh,190px)}
body.tv #logos img{height:var(--bh)}
body.tv #logos #lgbi{height:calc(var(--bh)*.55)}
body.tv #qr{height:var(--bh);box-sizing:border-box;padding:6px 8px}
body.tv #qrimg{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
body.tv #qrimg svg{height:100%;width:auto;max-width:100%;aspect-ratio:1/1}
body.tv #qrt{font-size:.9rem;line-height:1.2;margin-top:3px;white-space:nowrap}
body.tv .pool{height:calc(100dvh - var(--bh) - 2.4vh - 202px)}
/* ---- Modo TV en pantallas verticales (móvil): QR, logo y escudo caben en una fila ---- */
@media (max-aspect-ratio:1/1){
 body.tv{--bh:clamp(64px,20vw,120px)}
 body.tv #qr{width:calc(var(--bh)*1.15);border-width:4px;border-radius:12px;padding:4px 5px}
 body.tv #qrt{font-size:.58rem;line-height:1.15;white-space:normal;text-align:center}
 body.tv #logos{padding:0 3vw}
 body.tv .lane .s{font-size:2.9vw;line-height:1.15;overflow-wrap:normal;word-break:normal}
 body.tv .lane .n{font-size:8vw}
}
/* ---- Botón «Live» con pulso rojo lento y sutil ---- */
.lvd{position:relative;display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;animation:lvblink 3.2s ease-in-out infinite}
.lvd::after{content:"";position:absolute;inset:0;border-radius:50%;background:#ef4444;animation:lvpulse 3.2s ease-out infinite}
@keyframes lvblink{0%,100%{opacity:1}50%{opacity:.65}}
@keyframes lvpulse{0%{transform:scale(1);opacity:.35}70%,100%{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.lvd,.lvd::after{animation:none}}
</style>
</head>
<body class="tv">
<div class="bgw" id="bgw" aria-hidden="true"></div>
<header class="row" style="justify-content:flex-end"><button id="adm">Entrar como admin</button></header>
<div id="clk"><div id="ct"></div><div id="cs"></div><div id="sy"></div></div>
<div class="card" id="lg" hidden><div class="row"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="p" id="go">Entrar</button><button id="lc">Cancelar</button></div><div class="now" id="lgm" style="margin-top:8px"></div></div>
<div class="row" id="vrow" style="margin:10px 0"><span class="now">Ver:</span>
<select id="vd"></select><input type="time" id="vt"><button id="vn">Ahora</button></div>
<div id="cq"><div id="cqhead"><h1>Consultar calles</h1><p>Piscina de Almàssera</p></div><div class="gl" id="cqd"></div><div class="gl" id="cqbox"><div id="cqs"></div>
<div id="cqw"><div class="wh" id="cqwh"></div><b>:</b><div class="wh" id="cqwm"></div></div>
<div class="now" style="text-align:center;font-size:.8rem">Toca la hora para escribirla</div>
<div class="row" style="justify-content:center;margin-top:6px"><button id="cqn">Ahora</button></div></div></div>

function saveSess(s){sess=s;try{s?localStorage.setItem("pool_sess",JSON.stringify(s)):localStorage.removeItem("pool_sess")}catch(e){}}
function api(path,opt,tok){
  opt=opt||{};
  const h=Object.assign({apikey:SUPA_KEY,"Content-Type":"application/json"},tok?{Authorization:"Bearer "+tok}:{},opt.headers||{});
  return fetch(SUPA_URL+path,Object.assign({},opt,{headers:h}));

function toSess(j){return{access:j.access_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000}}
async function login(email,pw){
  const r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password:pw})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||"Email o contraseña incorrectos");
  saveSess(toSess(j));
}
async function refresh(){
  if(!sess)return false;
  try{const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:sess.refresh})});
    const j=await r.json();if(!r.ok)throw 0;saveSess(toSess(j));return true}
  catch(e){saveSess(null);return false}
}
async function token(){if(!sess)return null;if(Date.now()>sess.exp-60000&&!await refresh())return null;return sess.access}
function normLane(l){
  const o={s:KEYS.includes(typeof l==="string"?l:l&&l.s)?(typeof l==="string"?l:l.s):"free"};
  if(l&&typeof l==="object"){if(typeof l.n==="string"&&l.n.trim())o.n=l.n.trim().slice(0,30);if(/^#[0-9a-f]{6}$/i.test(l.c||""))o.c=l.c}
  return o;
}
function normSlot(s){
  const L=Array.isArray(s.lanes)?s.lanes:[];
  return{id:String(s.id||"s"+Math.random().toString(36).slice(2)),name:String(s.name||""),start:String(s.start||"00:00"),end:String(s.end||"00:00"),days:Array.isArray(s.days)?s.days.filter(d=>d>=0&&d<7):[],lanes:Array.from({length:6},(_,i)=>normLane(L[i]))};
}
function applyData(d){
  slots=Array.isArray(d.slots)?d.slots.map(normSlot):[];
  const c=d.cfg||{};
  KEYS.forEach(k=>{if(c[k]&&c[k].name!=="Intermedio")cfg[k]={name:typeof c[k].name==="string"?c[k].name:DEF[k].name,color:/^#[0-9a-f]{6}$/i.test(c[k].color||"")?c[k].color:DEF[k].color}});

async function load(){
  try{const r=await api("/rest/v1/pool_data?id=eq.1&select=data",{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();if(j[0])applyData(j[0].data||{});
    return true}
  catch(e){setMsg("No se pudo cargar: "+e.message);return false}
}
function persist(){
  dirty=true;
  q=q.then(async()=>{
    const t=await token();
    if(!t){dirty=false;setAdmin();setMsg("La sesión ha caducado. Vuelve a entrar.");return}
    try{
      const r=await api("/rest/v1/pool_data?id=eq.1",{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({data:{slots,cfg},updated_at:new Date().toISOString()})},t);
      const j=await r.json().catch(()=>null);
      if(!r.ok)throw new Error((j&&j.message)||r.status);
      if(!Array.isArray(j)||!j.length)throw new Error("no se actualizó ninguna fila (revisa la fila id=1 y las políticas)");
      setMsg("Guardado ✓")
    }catch(e){setMsg("Error al guardar: "+e.message)}
    dirty=false;
  });
  return q;
}

function qrWaveSvg(q){
  const n=q.getModuleCount(),m=2,R=.5,f=(r,c)=>r>=0&&c>=0&&r<n&&c<n&&q.isDark(r,c);
  const fin=(r,c)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
  let d="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(!f(r,c)||fin(r,c))continue;
    const up=f(r-1,c),dn=f(r+1,c),lf=f(r,c-1),rt=f(r,c+1);
    const tl=!up&&!lf?R:0,tr=!up&&!rt?R:0,br=!dn&&!rt?R:0,bl=!dn&&!lf?R:0;
    const x=c+m,y=r+m;
    d+=`M${x+tl} ${y}H${x+1-tr}${tr?`A${tr} ${tr} 0 0 1 ${x+1} ${y+tr}`:""}V${y+1-br}${br?`A${br} ${br} 0 0 1 ${x+1-br} ${y+1}`:""}H${x+bl}${bl?`A${bl} ${bl} 0 0 1 ${x} ${y+1-bl}`:""}V${y+tl}${tl?`A${tl} ${tl} 0 0 1 ${x+tl} ${y}`:""}Z`;
  }
  const rr=(x,y,w,h,k)=>`M${x+k} ${y}H${x+w-k}A${k} ${k} 0 0 1 ${x+w} ${y+k}V${y+h-k}A${k} ${k} 0 0 1 ${x+w-k} ${y+h}H${x+k}A${k} ${k} 0 0 1 ${x} ${y+h-k}V${y+k}A${k} ${k} 0 0 1 ${x+k} ${y}Z`;
  const eye=(r,c)=>{const x=c+m,y=r+m;return rr(x,y,7,7,.8)+rr(x+1,y+1,5,5,.5)+rr(x+2,y+2,3,3,.4)};
  d+=eye(0,0)+eye(0,n-7)+eye(n-7,0);
  const S=n+2*m;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}" shape-rendering="geometricPrecision"><rect width="${S}" height="${S}" fill="#fff"/><path d="${d}" fill="#0a1a2f" fill-rule="evenodd"/></svg>`;
}

function alignLogo(){ /* centra el logo sobre la línea discontinua entre las calles 3 y 4 */

  if(lg&&!document.body.classList.contains("tv")){lg.style.transform="";return}

(function(){const ic=document.querySelector("#info .ic");let y0=null,dy=0;
  ic.addEventListener("touchstart",e=>{y0=ic.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});
  ic.addEventListener("touchmove",e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;
    if(dy>0){ic.style.transition="none";ic.style.transform="translateY("+dy+"px)";ic.style.opacity=Math.max(.35,1-dy/420)}else dy=0},{passive:true});
  ic.addEventListener("touchend",()=>{if(y0===null)return;y0=null;ic.style.transition="";ic.style.transform="";ic.style.opacity="";if(dy>90)closeInfo();dy=0});
  ic.addEventListener("touchcancel",()=>{y0=null;ic.style.transition="";ic.style.transform="";ic.style.opacity=""});
})();

function tick(){
  const n=nowP(),t=n.h+":"+n.m;
  $("ct").textContent=view?view.t:t+":"+n.s;
  if(!view&&t!==lastMin){lastMin=t;syncView();render()}
}
async function syncTime(){
  const tries=[
    async()=>{const t0=Date.now();const r=await api("/rest/v1/rpc/server_time",{method:"POST",body:"{}"});if(!r.ok)throw 0;return{ms:Date.parse(await r.json()),t0,t1:Date.now(),src:"servidor"}},
    async()=>{const t0=Date.now();const r=await api("/rest/v1/pool_data?id=eq.1&select=id",{cache:"no-store"});const h=r.headers.get("date");if(!h)throw 0;return{ms:Date.parse(h)+500,t0,t1:Date.now(),src:"servidor"}},
    async()=>{const t0=Date.now();const r=await fetch("https://timeapi.io/api/Time/current/zone?timeZone=UTC",{cache:"no-store"});const j=await r.json();return{ms:Date.parse(j.dateTime.replace(/(\.\d{3})\d*/,"$1")+"Z"),t0,t1:Date.now(),src:"timeapi.io"}}
  ];
  for(const f of tries){
    try{const x=await f();if(isNaN(x.ms))throw 0;
      off=x.ms+(x.t1-x.t0)/2-x.t1;
      $("sy").textContent="Hora sincronizada ("+x.src+")";return}
    catch(e){}
  }
  $("sy").textContent="Sin sincronizar: usando la hora del dispositivo";
}
function loop(){tick();setTimeout(loop,1000-((Date.now()+off)%1000)+10)}
loop();syncTime();setInterval(syncTime,600000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncTime()});
